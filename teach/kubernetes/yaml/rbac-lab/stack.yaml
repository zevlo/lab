apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: rbac-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: rbac-lab
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets
  namespace: rbac-lab
subjects:
- kind: ServiceAccount
  name: secret-reader
  namespace: rbac-lab
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: app-config
  namespace: rbac-lab
type: Opaque
stringData:
  note: "lab secret for list/get practice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader
  namespace: rbac-lab
  labels:
    app: reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reader
  template:
    metadata:
      labels:
        app: reader
    spec:
      serviceAccountName: secret-reader
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
