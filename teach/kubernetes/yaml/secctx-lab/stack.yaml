apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleeper
  namespace: secctx-lab
  labels:
    app: sleeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleeper
  template:
    metadata:
      labels:
        app: sleeper
    spec:
      containers:
      - name: sleep
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
