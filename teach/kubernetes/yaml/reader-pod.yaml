apiVersion: v1
kind: Pod
metadata:
  name: reader
  namespace: storage-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["/bin/sh", "-c", "cat /data/message.txt && sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
