apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: deploy-incident-lab
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: deploy-incident-lab
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
