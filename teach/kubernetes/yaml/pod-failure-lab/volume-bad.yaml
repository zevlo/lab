apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: pod-failure-lab
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: typo-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-wait
  namespace: pod-failure-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: app-data
